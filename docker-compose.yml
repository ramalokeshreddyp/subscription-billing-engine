services:
  db:
    image: postgres:15-alpine
    container_name: subscription_billing_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscription_billing
    ports:
      - "5432:5432"
    volumes:
      - ./src/infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscription_billing_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: subscription_billing
      DATABASE_URL: postgresql://postgres:postgres@db:5432/subscription_billing
      PAYMENT_API_KEY: mock_stripe_key_sec_12345
    depends_on:
      db:
        condition: service_healthy
